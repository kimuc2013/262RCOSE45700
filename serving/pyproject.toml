[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ku-academic-mcp"
version = "0.1.0"
description = "Team 7 academic evidence service"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
academic-mcp = "academic_mcp.server:main"
academic-data = "academic_mcp.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
